name: Primal Directive verification

on:
  push:
    branches:
      - fix/production-auth-database

permissions:
  contents: write

concurrency:
  group: primal-directive-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out existing repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Reconcile and install dependencies
        run: npm install --no-audit --no-fund
      - name: Commit normalized lockfile if npm repaired it
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "ci: regenerate normalized dependency lockfile"
            git push
          fi
      - name: Verify authentication invariants
        run: npm run check:auth
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Production build
        run: npm run build
