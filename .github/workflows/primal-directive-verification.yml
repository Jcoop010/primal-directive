name: Primal Directive verification

on:
  push:
    branches:
      - fix/production-auth-database
  pull_request:
    branches:
      - main
      - master
      - fix/production-auth-database

permissions:
  contents: read

concurrency:
  group: primal-directive-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out existing repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify authentication invariants
        run: npm run check:auth
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Production build
        run: npm run build
