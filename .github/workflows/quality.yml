name: Primal Directive quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run automated tests
        run: npm test
      - name: Check TypeScript
        run: npm run typecheck
      - name: Check authentication invariants
        run: |
          npm run dev > /tmp/primal-directive-dev.log 2>&1 &
          DEV_PID=$!
          trap 'kill "$DEV_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 45); do
            if curl --silent --show-error --fail http://127.0.0.1:8080/__app-env > /dev/null; then
              npm run check:auth
              exit $?
            fi
            if ! kill -0 "$DEV_PID" 2>/dev/null; then
              cat /tmp/primal-directive-dev.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/primal-directive-dev.log
          echo "Dev server did not expose /__app-env within 45 seconds."
          exit 1
      - name: Lint
        run: npm run lint
