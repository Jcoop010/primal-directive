name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Remove committed Vercel build output and normalize lockfile
        run: |
          if [ -d .vercel/output ]; then
            rm -rf .vercel/output
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci

      - name: Verify authentication invariants against the running dev server
        run: |
          npm run dev > /tmp/primal-directive-dev.log 2>&1 &
          DEV_PID=$!
          trap 'kill "$DEV_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8080/__app-env > /dev/null; then
              npm run check:auth
              node --input-type=module <<'NODE'
              const base = "http://127.0.0.1:8080/api/auth";
              const email = `ci-${Date.now()}-${Math.random().toString(36).slice(2)}@example.com`;
              const password = "CI-Only-Test-Password-123!";
              async function post(path, payload) {
                const response = await fetch(`${base}/${path}`, {
                  method: "POST",
                  headers: { "content-type": "application/json" },
                  body: JSON.stringify(payload),
                });
                const body = await response.json().catch(() => null);
                if (!response.ok) {
                  console.error(`Auth integration failed at ${path}: HTTP ${response.status}`, body);
                  process.exit(1);
                }
                return body;
              }
              const created = await post("sign-up/email", { name: "CI Auth Test", email, password });
              if (created?.user?.email !== email) {
                console.error("Sign-up endpoint did not return the newly created test user.", created);
                process.exit(1);
              }
              const signedIn = await post("sign-in/email", { email, password });
              if (signedIn?.user?.email !== email) {
                console.error("Sign-in endpoint did not return the authenticated test user.", signedIn);
                process.exit(1);
              }
              console.log("Auth integration passed: sign-up and sign-in both succeeded.");
              NODE
              exit $?
            fi
            if ! kill -0 "$DEV_PID" 2>/dev/null; then
              cat /tmp/primal-directive-dev.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/primal-directive-dev.log
          echo "Dev server did not become ready in time."
          exit 1

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      # Keep main deployable only after the full production verification passes.
