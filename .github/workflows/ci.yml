name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Remove committed Vercel build output and normalize lockfile
        run: |
          if [ -d .vercel/output ]; then
            rm -rf .vercel/output
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci

      - name: Report dependency audit findings
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node --input-type=module -e '
            import fs from "node:fs";
            const report = JSON.parse(fs.readFileSync("/tmp/npm-audit.json", "utf8"));
            const vulnerabilities = Object.entries(report.vulnerabilities ?? {});
            console.log("Dependency audit summary:", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
            for (const [name, item] of vulnerabilities) {
              const advisories = (item.via ?? []).filter((entry) => typeof entry === "object");
              console.log(JSON.stringify({
                name,
                severity: item.severity,
                direct: item.isDirect,
                range: item.range,
                fixAvailable: item.fixAvailable,
                advisories: advisories.map((entry) => ({ title: entry.title, url: entry.url, range: entry.range })),
              }));
            }
          '

      - name: Verify authentication invariants against the running dev server
        run: |
          npm run dev > /tmp/primal-directive-dev.log 2>&1 &
          DEV_PID=$!
          trap 'kill "$DEV_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8080/__app-env > /dev/null; then
              npm run check:auth
              node scripts/ci-auth-smoke.mjs
              exit $?
            fi
            if ! kill -0 "$DEV_PID" 2>/dev/null; then
              cat /tmp/primal-directive-dev.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/primal-directive-dev.log
          echo "Dev server did not become ready in time."
          exit 1

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Install Chromium for desktop and mobile smoke checks
        run: npx playwright install chromium

      - name: Browser smoke checks on dev, built output and current production
        run: |
          sudo mkdir -p /workspace/screenshots
          sudo chown "$USER" /workspace/screenshots
          npm run dev -- --force > /tmp/primal-browser-dev.log 2>&1 &
          BROWSER_DEV_PID=$!
          trap 'kill "$BROWSER_DEV_PID" 2>/dev/null || true; npm run preview:stop' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8080/__app-env > /dev/null; then
              break
            fi
            sleep 2
          done
          # Warm the local Vite module graph before comparing dev and built output.
          curl --silent --fail --retry 5 --retry-delay 2 http://127.0.0.1:8080/ > /dev/null
          BROWSER_ALLOW_EXTERNAL_HOST=1 node scripts/browser-smoke.mjs https://primal-directive-loose-ends-co.vercel.app/ /workspace/screenshots/production.png
          BROWSER_ALLOW_EXTERNAL_HOST=1 node scripts/browser-smoke.mjs https://primal-directive-loose-ends-co.vercel.app/demo /workspace/screenshots/production-demo.png
          # The built output is the release artifact; use it for deterministic smoke validation.
          npm run preview:restart
          node scripts/browser-smoke.mjs http://127.0.0.1:8081/ /workspace/screenshots/dev.png
          node scripts/browser-smoke.mjs http://127.0.0.1:8081/ /workspace/screenshots/built.png --baseline /workspace/screenshots/dev.json || { cat .grok/preview.log; exit 1; }
          node scripts/ci-browser-acceptance.mjs
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            AUTH_SMOKE_ORIGIN=https://primal-directive-loose-ends-co.vercel.app node scripts/ci-auth-smoke.mjs
            AUTH_SMOKE_ORIGIN=https://primal-directive-loose-ends-co.vercel.app node scripts/ci-browser-acceptance.mjs
          fi

      - name: Expose public and fictional QA screenshots for connector review
        if: always()
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            for (const name of ["production-demo.png", "production-demo-mobile.png", "authenticated-money.png", "authenticated-mobile.png", "acceptance-failure.png", ...fs.readdirSync("/workspace/screenshots").filter((name) => /^qa-.*[.]jpg$/.test(name))]) {
              const path = "/workspace/screenshots/" + name;
              if (fs.existsSync(path)) console.log("QA_PNG_JSON=" + JSON.stringify({ name, base64: fs.readFileSync(path).toString("base64") }));
            }
          '

      - name: Upload public browser screenshots and verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke
          path: /workspace/screenshots/
          retention-days: 3

      # Keep main deployable only after the full production verification passes.
