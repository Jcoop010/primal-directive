name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Remove committed Vercel build output and normalize lockfile
        run: |
          if [ -d .vercel/output ]; then
            rm -rf .vercel/output
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ! git diff --quiet -- package-lock.json || [ -n "$(git status --porcelain .vercel 2>/dev/null || true)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+users.noreply.github.com"
            git add package-lock.json
            if [ -d .vercel ]; then
              git add -A .vercel
            fi
            git commit -m "chore: normalize dependency lockfile"
            git push
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify authentication invariants
        run: npm run check:auth

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      # Keep main deployable only after the full production verification passes.
